<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Kalender Pendidikan Yayasan Al Muhajirin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <!-- Login Form -->
        <div id="loginForm" class="max-w-md mx-auto bg-white rounded-2xl shadow p-6 mt-20">
            <div class="text-center mb-4">
                <img src="https://placehold.co/80x80/1e5631/white?text=LOGO" class="mx-auto rounded-full">
                <h2 class="text-2xl font-bold text-[#1e5631] mt-2">Admin Panel</h2>
                <p class="text-gray-500">Yayasan Pendidikan Al Muhajirin</p>
            </div>
            <input type="text" id="username" placeholder="Username" class="w-full border rounded-lg p-2 my-2">
            <input type="password" id="password" placeholder="Password" class="w-full border rounded-lg p-2 my-2">
            <button onclick="login()" class="bg-[#1e5631] text-white w-full py-2 rounded-lg mt-2">Masuk</button>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="hidden">
            <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow mb-4">
                <h2 class="text-xl font-bold"><i class="fas fa-calendar-alt text-[#c9a03d]"></i> Panel Kalender Pendidikan</h2>
                <div>
                    <span id="userRole" class="text-sm bg-gray-200 px-3 py-1 rounded-full"></span>
                    <span id="userName" class="text-sm ml-2"></span>
                    <button onclick="logout()" class="bg-red-500 text-white px-4 py-1 rounded-lg ml-3">Logout</button>
                </div>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
                <button onclick="loadMenu('events')" class="bg-[#1e5631] text-white p-3 rounded-lg shadow hover:opacity-90"><i class="fas fa-calendar-day"></i> Event</button>
                <button onclick="loadMenu('lembaga')" class="bg-[#c9a03d] text-[#1e5631] p-3 rounded-lg shadow hover:opacity-90" id="menuLembaga"><i class="fas fa-building"></i> Lembaga</button>
                <button onclick="loadMenu('users')" class="bg-gray-700 text-white p-3 rounded-lg shadow hover:opacity-90" id="menuUsers"><i class="fas fa-users"></i> User</button>
                <button onclick="loadMenu('tahun')" class="bg-gray-700 text-white p-3 rounded-lg shadow hover:opacity-90" id="menuTahun"><i class="fas fa-calendar-week"></i> Tahun Ajaran</button>
                <button onclick="loadMenu('pengumuman')" class="bg-gray-700 text-white p-3 rounded-lg shadow hover:opacity-90"><i class="fas fa-bullhorn"></i> Pengumuman</button>
                <button onclick="window.location.href='index.html'" class="bg-blue-600 text-white p-3 rounded-lg shadow hover:opacity-90 col-span-2 md:col-span-1"><i class="fas fa-eye"></i> Lihat Kalender</button>
            </div>
            
            <div id="mainContent" class="bg-white rounded-2xl shadow p-4">
                <p class="text-gray-400 text-center">Pilih menu di atas untuk mulai mengelola</p>
            </div>
        </div>
    </div>

    <script>
        let token = null, userRole = null, userLembagaIds = [];
        const GAS_URL = 'https://script.google.com/macros/s/YOUR_DEPLOY_ID/exec'; // GANTI

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if(!username || !password) return Swal.fire('Error', 'Username dan password wajib diisi', 'error');
            
            const res = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'login', username, password }),
                headers: { 'Content-Type': 'application/json' }
            });
            const json = await res.json();
            if(json.status === 'success') {
                token = json.data.token;
                userRole = json.data.role;
                userLembagaIds = json.data.lembaga_ids || [];
                localStorage.setItem('token', token);
                localStorage.setItem('role', userRole);
                localStorage.setItem('lembaga_ids', JSON.stringify(userLembagaIds));
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('userRole').innerText = userRole;
                document.getElementById('userName').innerText = json.data.nama;
                
                // Sembunyikan menu yang tidak sesuai role
                if(userRole !== 'superadmin') {
                    document.getElementById('menuLembaga')?.classList.add('hidden');
                    document.getElementById('menuUsers')?.classList.add('hidden');
                }
                loadMenu('events');
            } else {
                Swal.fire('Login Gagal', json.message, 'error');
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        async function fetchWithToken(endpoint) {
            const url = `${GAS_URL}?${endpoint}&token=${token}`;
            const res = await fetch(url);
            return res.json();
        }

        async function postWithToken(action, data) {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action, token, ...data }),
                headers: { 'Content-Type': 'application/json' }
            });
            return res.json();
        }

        async function loadMenu(menu) {
            const content = document.getElementById('mainContent');
            if(menu === 'events') {
                await loadEventsMenu(content);
            } else if(menu === 'lembaga' && userRole === 'superadmin') {
                await loadLembagaMenu(content);
            } else if(menu === 'users' && userRole === 'superadmin') {
                await loadUsersMenu(content);
            } else if(menu === 'tahun') {
                await loadTahunMenu(content);
            } else if(menu === 'pengumuman') {
                await loadPengumumanMenu(content);
            }
        }

        async function loadEventsMenu(container) {
            container.innerHTML = `<div class="flex justify-between items-center mb-4"><h3 class="text-xl font-bold">📅 Manajemen Event</h3><button onclick="showAddEventForm()" class="bg-green-600 text-white px-4 py-2 rounded-lg"><i class="fas fa-plus"></i> Tambah Event</button></div><div id="eventTable">Memuat...</div>`;
            
            let lembagaParam = 'semua';
            if(userRole !== 'superadmin') lembagaParam = userLembagaIds.join(',');
            const events = await fetchWithToken(`action=getEvents&lembagaId=${lembagaParam}`);
            
            let html = `<div class="overflow-x-auto"><table class="min-w-full bg-white border"><thead class="bg-gray-200"><tr><th>Judul</th><th>Kategori</th><th>Lembaga</th><th>Mulai</th><th>Selesai</th><th>Aksi</th></tr></thead><tbody>`;
            if(events.status === 'success' && events.data.length) {
                events.data.forEach(ev => {
                    html += `<tr class="border-b">
                        <td class="p-2">${ev.title}</td>
                        <td class="p-2"><span class="px-2 py-1 rounded text-white text-xs" style="background:${ev.color}">${ev.category}</span></td>
                        <td class="p-2">${ev.lembaga_nama}</td>
                        <td class="p-2">${ev.start}</td>
                        <td class="p-2">${ev.end || ev.start}</td>
                        <td class="p-2"><button onclick="deleteEvent(${ev.id})" class="text-red-600 hover:text-red-800"><i class="fas fa-trash"></i> Hapus</button></td>
                    </tr>`;
                });
            } else {
                html += `<tr><td colspan="6" class="text-center p-4">Belum ada event</td></tr>`;
            }
            html += `</tbody></table></div>`;
            container.innerHTML += html;
        }

        window.showAddEventForm = async () => {
            // Ambil daftar lembaga untuk dropdown
            const lembagaRes = await fetchWithToken('action=getLembaga');
            let lembagaOptions = '<option value="0">Semua Lembaga</option>';
            if(lembagaRes.status === 'success') {
                lembagaRes.data.forEach(l => {
                    lembagaOptions += `<option value="${l.id}">${l.nama}</option>`;
                });
            }
            
            const { value: formValues } = await Swal.fire({
                title: 'Tambah Event Baru',
                html: `
                    <input id="title" class="swal2-input" placeholder="Judul Event" required>
                    <select id="category" class="swal2-select">
                        <option>Libur Nasional</option><option>Ujian</option><option>Pondok</option>
                        <option>PPDB</option><option>Haflah</option><option>Rapat</option>
                        <option>Manasik</option><option>Arafah</option><option>Libur</option><option>MPLS</option>
                    </select>
                    <select id="lembaga_id" class="swal2-select">${lembagaOptions}</select>
                    <input id="start" type="date" class="swal2-input" required>
                    <input id="end" type="date" class="swal2-input" placeholder="Selesai (opsional)">
                    <textarea id="description" class="swal2-textarea" placeholder="Deskripsi"></textarea>
                    <input id="nomor_surat" class="swal2-input" placeholder="Nomor Surat (opsional)">
                `,
                focusConfirm: false,
                preConfirm: () => {
                    return {
                        title: document.getElementById('title').value,
                        category: document.getElementById('category').value,
                        lembaga_id: parseInt(document.getElementById('lembaga_id').value),
                        start: document.getElementById('start').value,
                        end: document.getElementById('end').value || document.getElementById('start').value,
                        description: document.getElementById('description').value,
                        nomor_surat: document.getElementById('nomor_surat').value,
                        tahun_ajaran_id: 1 // bisa dinamis, tapi sementara
                    };
                }
            });
            if(formValues) {
                const res = await postWithToken('addEvent', formValues);
                if(res.status === 'success') {
                    Swal.fire('Berhasil', 'Event ditambahkan', 'success');
                    loadMenu('events');
                } else {
                    Swal.fire('Gagal', res.message, 'error');
                }
            }
        };

        window.deleteEvent = async (id) => {
            const confirm = await Swal.fire({ title: 'Hapus event?', text: 'Data akan dihapus permanen', icon: 'warning', showCancelButton: true });
            if(confirm.isConfirmed) {
                const res = await postWithToken('deleteEvent', { id });
                if(res.status === 'success') loadMenu('events');
                else Swal.fire('Error', res.message, 'error');
            }
        };

        async function loadLembagaMenu(container) {
            container.innerHTML = `<div class="flex justify-between items-center mb-4"><h3 class="text-xl font-bold">🏫 Manajemen Lembaga</h3><button onclick="showAddLembagaForm()" class="bg-green-600 text-white px-4 py-2 rounded-lg"><i class="fas fa-plus"></i> Tambah Lembaga</button></div><div id="lembagaTable">Memuat...</div>`;
            const res = await fetchWithToken('action=getLembaga');
            let html = `<table class="min-w-full bg-white border"><thead class="bg-gray-200"><tr><th>Nama Lembaga</th><th>Kode</th><th>Warna</th><th>Kepala Sekolah</th><th>Aksi</th></tr></thead><tbody>`;
            if(res.status === 'success') {
                res.data.forEach(l => {
                    html += `<tr>
                        <td class="p-2">${l.nama}</td>
                        <td class="p-2">${l.kode}</td>
                        <td class="p-2"><span class="px-2 py-1 rounded text-white" style="background:${l.warna}">${l.warna}</span></td>
                        <td class="p-2">${l.kepala_sekolah || '-'}</td>
                        <td class="p-2"><button onclick="editLembaga(${l.id})" class="text-blue-600">Edit</button> | <button onclick="deleteLembaga(${l.id})" class="text-red-600">Hapus</button></td>
                    </tr>`;
                });
            }
            html += `</tbody></table>`;
            container.innerHTML += html;
        }

        window.showAddLembagaForm = async () => {
            const { value: form } = await Swal.fire({
                title: 'Tambah Lembaga Baru',
                html: `<input id="nama" class="swal2-input" placeholder="Nama Lembaga (contoh: SDIT)">
                       <input id="kode" class="swal2-input" placeholder="Kode (contoh: SD)">
                       <input id="warna" class="swal2-input" type="color" value="#3b82f6">
                       <input id="kepala" class="swal2-input" placeholder="Kepala Sekolah / Direktur">`,
                preConfirm: () => ({
                    nama: document.getElementById('nama').value,
                    kode: document.getElementById('kode').value,
                    warna: document.getElementById('warna').value,
                    kepala_sekolah: document.getElementById('kepala').value
                })
            });
            if(form) {
                const res = await postWithToken('addLembaga', form);
                if(res.status === 'success') loadMenu('lembaga');
                else Swal.fire('Gagal', res.message, 'error');
            }
        };

        window.deleteLembaga = async (id) => {
            const confirm = await Swal.fire({ title: 'Hapus lembaga?', text: 'Event yang terkait akan tetap ada tetapi lembaga_id menjadi tidak valid', icon: 'warning', showCancelButton: true });
            if(confirm.isConfirmed) {
                await postWithToken('deleteLembaga', { id });
                loadMenu('lembaga');
            }
        };

        async function loadUsersMenu(container) {
            container.innerHTML = `<div class="flex justify-between items-center mb-4"><h3 class="text-xl font-bold">👥 Manajemen User</h3><button onclick="showAddUserForm()" class="bg-green-600 text-white px-4 py-2 rounded-lg"><i class="fas fa-plus"></i> Tambah User</button></div><div id="userTable">Memuat...</div>`;
            const users = await fetchWithToken('action=getUsers');
            const lembagaMap = await fetchWithToken('action=getLembaga');
            const userLembaga = await fetchWithToken('action=getUserLembaga');
            let html = `<table class="min-w-full bg-white border"><thead class="bg-gray-200"><tr><th>Username</th><th>Nama</th><th>Role</th><th>Akses Lembaga</th><th>Aksi</th></tr></thead><tbody>`;
            if(users.status === 'success') {
                users.data.forEach(u => {
                    let akses = '-';
                    if(u.role !== 'superadmin' && userLembaga.data && userLembaga.data[u.username]) {
                        akses = userLembaga.data[u.username].map(id => {
                            const lem = lembagaMap.data.find(l => l.id == id);
                            return lem ? lem.nama : id;
                        }).join(', ');
                    }
                    html += `<tr>
                        <td class="p-2">${u.username}</td>
                        <td class="p-2">${u.nama}</td>
                        <td class="p-2">${u.role}</td>
                        <td class="p-2">${akses}</td>
                        <td class="p-2"><button onclick="deleteUser('${u.username}')" class="text-red-600">Hapus</button></td>
                    </tr>`;
                });
            }
            html += `</tbody></table>`;
            container.innerHTML += html;
        }

        window.showAddUserForm = async () => {
            const lembagaRes = await fetchWithToken('action=getLembaga');
            let lembagaCheckboxes = '';
            if(lembagaRes.status === 'success') {
                lembagaRes.data.forEach(l => {
                    lembagaCheckboxes += `<label><input type="checkbox" value="${l.id}" class="lembaga-check"> ${l.nama}</label><br>`;
                });
            }
            const { value: form } = await Swal.fire({
                title: 'Tambah User Baru',
                html: `<input id="username" class="swal2-input" placeholder="Username">
                       <input id="nama" class="swal2-input" placeholder="Nama Lengkap">
                       <input id="password" type="password" class="swal2-input" placeholder="Password">
                       <select id="role" class="swal2-select">
                           <option value="operator">Operator</option>
                           <option value="guru">Guru (hanya lihat)</option>
                       </select>
                       <div id="lembagaSelect" style="margin-top:10px;">Pilih Lembaga yang Dikelola:<br>${lembagaCheckboxes}</div>`,
                preConfirm: () => {
                    const selectedLembaga = Array.from(document.querySelectorAll('.lembaga-check:checked')).map(cb => parseInt(cb.value));
                    return {
                        username: document.getElementById('username').value,
                        nama: document.getElementById('nama').value,
                        password: document.getElementById('password').value,
                        role: document.getElementById('role').value,
                        lembaga_ids: selectedLembaga
                    };
                }
            });
            if(form) {
                const res = await postWithToken('addUser', form);
                if(res.status === 'success') loadMenu('users');
                else Swal.fire('Gagal', res.message, 'error');
            }
        };

        window.deleteUser = async (username) => {
            const confirm = await Swal.fire({ title: 'Hapus user?', icon: 'warning', showCancelButton: true });
            if(confirm.isConfirmed) {
                await postWithToken('deleteUser', { username });
                loadMenu('users');
            }
        };

        async function loadTahunMenu(container) {
            container.innerHTML = `<h3 class="text-xl font-bold mb-4">📆 Tahun Ajaran</h3><div id="tahunList">Memuat...</div><button onclick="showAddTahunForm()" class="bg-green-600 text-white px-4 py-2 rounded-lg mt-2">+ Tambah Tahun Ajaran</button>`;
            const res = await fetchWithToken('action=getTahunAjaran');
            let html = `<table class="min-w-full bg-white border"><thead class="bg-gray-200"><tr><th>Nama</th><th>Status</th><th>Mulai</th><th>Selesai</th><th>Aksi</th></tr></thead><tbody>`;
            if(res.status === 'success') {
                res.data.forEach(t => {
                    html += `<tr>
                        <td class="p-2">${t.nama}</td>
                        <td class="p-2">${t.aktif ? '<span class="text-green-600 font-bold">Aktif</span>' : 'Tidak aktif'}</td>
                        <td class="p-2">${t.mulai || '-'}</td>
                        <td class="p-2">${t.selesai || '-'}</td>
                        <td class="p-2">${!t.aktif ? `<button onclick="setAktifTahun(${t.id})" class="bg-blue-500 text-white px-2 py-1 rounded">Jadikan Aktif</button>` : '-'}</td>
                    </tr>`;
                });
            }
            html += `</tbody></table>`;
            container.innerHTML += html;
        }

        window.setAktifTahun = async (id) => {
            await postWithToken('setTahunAktif', { id });
            loadMenu('tahun');
        };

        async function loadPengumumanMenu(container) {
            container.innerHTML = `<h3 class="text-xl font-bold mb-4">📢 Running Text Pengumuman</h3><div id="pengumumanList">Memuat...</div><button onclick="showAddPengumumanForm()" class="bg-green-600 text-white px-4 py-2 rounded-lg mt-2">+ Tambah Pengumuman</button>`;
            // Untuk sederhana, kita tampilkan form tambah dan list dari sheet (tapi karena GAS belum ada endpoint getPengumumanAll, kita buat langsung)
            const res = await fetchWithToken('action=getPengumuman'); // hanya yang aktif
            let html = `<ul class="list-disc pl-5">`;
            if(res.status === 'success' && res.data.length) {
                res.data.forEach(p => { html += `<li>${p}</li>`; });
            } else { html += `<li>Belum ada pengumuman aktif</li>`; }
            html += `</ul>`;
            container.innerHTML += html;
        }

        window.showAddPengumumanForm = async () => {
            const { value: form } = await Swal.fire({
                title: 'Tambah Pengumuman',
                html: `<textarea id="teks" class="swal2-textarea" placeholder="Teks pengumuman"></textarea>
                       <input id="mulai" type="date" class="swal2-input">
                       <input id="selesai" type="date" class="swal2-input">`,
                preConfirm: () => ({
                    teks: document.getElementById('teks').value,
                    mulai: document.getElementById('mulai').value,
                    selesai: document.getElementById('selesai').value
                })
            });
            if(form) {
                await postWithToken('addPengumuman', form);
                loadMenu('pengumuman');
            }
        };

        // Cek token saat load
        if(localStorage.getItem('token')) {
            token = localStorage.getItem('token');
            userRole = localStorage.getItem('role');
            userLembagaIds = JSON.parse(localStorage.getItem('lembaga_ids') || '[]');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('userRole').innerText = userRole;
            if(userRole !== 'superadmin') {
                document.getElementById('menuLembaga')?.classList.add('hidden');
                document.getElementById('menuUsers')?.classList.add('hidden');
            }
            loadMenu('events');
        }
    </script>
</body>
</html>
