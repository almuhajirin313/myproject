<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Ponpes Al Muhajirin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <div id="loginForm" class="max-w-md mx-auto bg-white rounded-2xl shadow p-6 mt-20">
            <h2 class="text-2xl font-bold text-[#1e5631] text-center">Login Admin</h2>
            <input type="text" id="username" placeholder="Username" class="w-full border rounded-lg p-2 my-2">
            <input type="password" id="password" placeholder="Password" class="w-full border rounded-lg p-2 my-2">
            <button onclick="login()" class="bg-[#1e5631] text-white w-full py-2 rounded-lg">Masuk</button>
        </div>
        <div id="dashboard" class="hidden">
            <!-- Header + menu role-based -->
            <div class="flex justify-between bg-white p-3 rounded-lg shadow mb-4">
                <h2 class="text-xl font-bold"><i class="fas fa-calendar-alt text-[#c9a03d]"></i> Panel Kalender Pendidikan</h2>
                <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
            </div>
            <div class="grid md:grid-cols-4 gap-4 mb-6">
                <button onclick="loadMenu('events')" class="bg-[#1e5631] text-white p-3 rounded">📅 Kelola Event</button>
                <button onclick="loadMenu('users')" class="bg-[#c9a03d] text-[#1e5631] p-3 rounded" id="menuUsers">👥 Kelola User</button>
                <button onclick="loadMenu('tahun')" class="bg-gray-700 text-white p-3 rounded">📆 Tahun Ajaran</button>
                <button onclick="window.location.href='index.html'" class="bg-gray-500 text-white p-3 rounded">🌐 Lihat Kalender</button>
            </div>
            <div id="mainContent" class="bg-white rounded-2xl shadow p-4">Pilih menu di atas</div>
        </div>
    </div>
    <script>
        let token = null, userRole = null;
        const GAS_URL = 'https://script.google.com/macros/s/YOUR_DEPLOY_ID/exec';

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'login', username, password }),
                headers: { 'Content-Type': 'application/json' }
            });
            const json = await res.json();
            if(json.status === 'success') {
                token = json.data.token;
                userRole = json.data.role;
                localStorage.setItem('token', token);
                localStorage.setItem('role', userRole);
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                if(userRole !== 'superadmin') document.getElementById('menuUsers').classList.add('hidden');
                loadMenu('events');
            } else Swal.fire('Error', json.message, 'error');
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        async function loadMenu(menu) {
            const content = document.getElementById('mainContent');
            if(menu === 'events') {
                content.innerHTML = `<h3>📋 Manajemen Event</h3><div id="eventList">Memuat...</div><button onclick="showAddEventForm()" class="bg-green-600 text-white p-2 rounded my-2">+ Tambah Event</button>`;
                const events = await fetchWithToken(`?action=getEvents`);
                let html = `<table class="w-full text-sm"><tr class="bg-gray-200"><th>Judul</th><th>Kategori</th><th>Mulai</th><th>Aksi</th></tr>`;
                events.data.forEach(ev => {
                    html += `<tr><td>${ev.title}</td><td>${ev.category}</td><td>${ev.start}</td><td><button onclick="deleteEvent(${ev.id})" class="text-red-600">Hapus</button></td></tr>`;
                });
                content.innerHTML += html;
            } else if(menu === 'users' && userRole === 'superadmin') {
                content.innerHTML = `<h3>👥 Manajemen User</h3><div id="userList">Memuat...</div><button onclick="showAddUserForm()" class="bg-blue-600 text-white p-2 rounded my-2">+ Tambah User</button>`;
                // implement fetch users dari sheet (tambahkan endpoint di GAS)
            }
        }

        async function fetchWithToken(endpoint) {
            return fetch(`${GAS_URL}${endpoint}&token=${token}`).then(r=>r.json());
        }

        window.deleteEvent = async (id) => {
            await fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'deleteEvent', id, token }) });
            loadMenu('events');
        };
        window.showAddEventForm = () => { /* modal form */ alert('Form tambah event (implementasikan dengan SweetAlert2)'); };
        if(localStorage.getItem('token')) {
            token = localStorage.getItem('token');
            userRole = localStorage.getItem('role');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            if(userRole !== 'superadmin') document.getElementById('menuUsers').classList.add('hidden');
            loadMenu('events');
        }
    </script>
</body>
</html>
