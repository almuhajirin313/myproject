<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Kalender Pendidikan | Ponpes Al Muhajirin</title>
    <!-- Tailwind + Font Awesome + FullCalendar -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales-all.min.js"></script>
    <!-- Hijriyah library -->
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>
    <style>
        :root { --primary: #1e5631; --gold: #c9a03d; }
        body { background: #f4f7f6; font-family: 'Inter', system-ui; }
        .fc-event { cursor: pointer; border-radius: 6px; font-size: 0.85rem; }
        .fc-day-today { background: #e6f7ec !important; }
        .dark { background-color: #1a2a1f; color: #e0e0e0; }
        .dark .fc { color: #333; }
        @media print {
            .no-print, .fc-header-toolbar, .fc-col-header, .fc-daygrid-day-frame, .fc-daygrid-day-events, .btn-print { display: none !important; }
            .fc-daygrid-day-number { font-size: 14pt; }
            body, .fc, .fc-daygrid-body { background: white; color: black; }
        }
    </style>
</head>
<body class="transition-colors duration-300">
    <!-- Header Lembaga -->
    <header class="bg-[#1e5631] text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="https://placehold.co/50x50/1e5631/white?text=LOGO" alt="Logo" class="w-12 h-12 rounded-full border-2 border-[#c9a03d]">
                <div>
                    <h1 class="font-bold text-xl">Pondok Pesantren Al Muhajirin</h1>
                    <p class="text-xs text-[#c9a03d]">Kalender Pendidikan Terintegrasi</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button id="darkModeToggle" class="bg-[#c9a03d] text-[#1e5631] px-3 py-1 rounded-full text-sm"><i class="fas fa-moon"></i> Mode</button>
                <a href="admin.html" class="bg-white text-[#1e5631] px-4 py-1 rounded-full text-sm font-semibold"><i class="fas fa-lock"></i> Admin</a>
            </div>
        </div>
        <div id="runningText" class="bg-[#0f2e1a] py-2 text-center text-sm overflow-hidden whitespace-nowrap animate-marquee">Memuat pengumuman...</div>
    </header>

    <main class="container mx-auto px-4 py-6">
        <!-- Widget Jadwal Sholat -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-4 mb-6 flex flex-wrap justify-between items-center">
            <div class="flex items-center gap-2"><i class="fas fa-mosque text-[#1e5631] text-xl"></i><span class="font-semibold">Jadwal Sholat (Cianjur)</span></div>
            <div id="sholatWidget" class="grid grid-cols-6 gap-2 text-center text-sm">Memuat...</div>
        </div>

        <!-- Filter Tahun Ajaran -->
        <div class="mb-4 flex justify-between items-center">
            <select id="tahunAjaranSelect" class="border border-gray-300 rounded-lg px-4 py-2 bg-white dark:bg-gray-700"></select>
            <div>
                <button onclick="printCalendar()" class="bg-[#1e5631] text-white px-4 py-2 rounded-lg"><i class="fas fa-print"></i> Cetak Bulanan</button>
                <button id="toggleYearView" class="bg-[#c9a03d] text-[#1e5631] px-4 py-2 rounded-lg ml-2"><i class="fas fa-calendar-alt"></i> Tampilan Tahunan</button>
            </div>
        </div>

        <!-- Container Kalender -->
        <div id="calendarContainer" class="bg-white dark:bg-gray-800 rounded-2xl shadow p-4"></div>
        
        <!-- Tampilan tahunan (hidden) -->
        <div id="yearView" class="hidden bg-white dark:bg-gray-800 rounded-2xl shadow p-4 mt-4 overflow-x-auto">
            <h3 class="text-xl font-bold mb-3 text-[#1e5631]">Kalender Tahunan 2025</h3>
            <div id="yearGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </div>
    </main>

    <footer class="text-center text-gray-500 py-4 text-sm border-t mt-8">
        &copy; 2025 Ponpes Al Muhajirin - Kalender Pendidikan | Data realtime dari Google Spreadsheet
    </footer>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/YOUR_DEPLOY_ID/exec'; // GANTI dengan URL GAS Anda
        let currentCalendar = null;
        let eventsData = [];
        let categories = [];

        // Dark mode
        const darkModeToggle = document.getElementById('darkModeToggle');
        darkModeToggle.addEventListener('click', () => document.documentElement.classList.toggle('dark'));

        // Ambil data konfigurasi
        async function fetchConfig() { return (await fetch(`${GAS_URL}?action=getConfig`).then(r=>r.json())).data; }
        async function fetchCategories() { const res=await fetch(`${GAS_URL}?action=getCategories`); return (await res.json()).data; }
        async function fetchTahunAjaran() { const res=await fetch(`${GAS_URL}?action=getTahunAjaran`); return (await res.json()).data; }
        async function fetchEvents(tahunId) { const res=await fetch(`${GAS_URL}?action=getEvents&tahunAjaranId=${tahunId}`); return (await res.json()).data; }
        async function fetchPengumuman() { const res=await fetch(`${GAS_URL}?action=getPengumuman`); return (await res.json()).data; }

        // Running text
        async function loadRunningText() {
            const texts = await fetchPengumuman();
            const runningDiv = document.getElementById('runningText');
            if(texts.length) runningDiv.innerHTML = `<marquee>✨ ${texts.join(' ✨ • ✨ ')} ✨</marquee>`;
            else runningDiv.innerHTML = '<marquee>Selamat datang di Kalender Pendidikan Al Muhajirin</marquee>';
        }

        // Jadwal Sholat (API Aladhan)
        async function loadPrayerTimes() {
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Cianjur&country=Indonesia&method=2');
                const data = await res.json();
                const timings = data.data.timings;
                const widget = document.getElementById('sholatWidget');
                widget.innerHTML = `
                    <div><strong>Imsak</strong><br>${timings.Imsak}</div>
                    <div><strong>Subuh</strong><br>${timings.Fajr}</div>
                    <div><strong>Dzuhur</strong><br>${timings.Dhuhr}</div>
                    <div><strong>Ashar</strong><br>${timings.Asr}</div>
                    <div><strong>Maghrib</strong><br>${timings.Maghrib}</div>
                    <div><strong>Isya</strong><br>${timings.Isha}</div>
                `;
            } catch(e) { console.log(e); }
        }

        // Inisialisasi FullCalendar
        async function initCalendar(tahunId) {
            eventsData = await fetchEvents(tahunId);
            const calEl = document.getElementById('calendarContainer');
            if(currentCalendar) currentCalendar.destroy();
            currentCalendar = new FullCalendar.Calendar(calEl, {
                initialView: 'dayGridMonth',
                locale: 'id',
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,dayGridWeek' },
                events: eventsData.map(ev => ({
                    title: ev.title,
                    start: ev.start,
                    end: ev.end,
                    color: ev.color,
                    extendedProps: { description: ev.description, surat: ev.nomor_surat, category: ev.category }
                })),
                eventClick: function(info) {
                    alert(`📌 ${info.event.title}\n📅 ${info.event.start.toLocaleDateString()} - ${info.event.end?.toLocaleDateString() || info.event.start.toLocaleDateString()}\n📝 ${info.event.extendedProps.description || 'Tidak ada deskripsi'}\n📄 Surat: ${info.event.extendedProps.surat || '-'}`);
                }
            });
            currentCalendar.render();
        }

        // Tampilan tahunan sederhana
        async function showYearView() {
            const tahunId = document.getElementById('tahunAjaranSelect').value;
            const events = await fetchEvents(tahunId);
            const year = new Date().getFullYear();
            const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
            const grid = document.getElementById('yearGrid');
            grid.innerHTML = '';
            for(let m=0; m<12; m++) {
                const monthEvents = events.filter(e => new Date(e.start).getMonth() === m);
                const card = document.createElement('div');
                card.className = 'border rounded-xl p-2 bg-gray-50 dark:bg-gray-700';
                card.innerHTML = `<h4 class="font-bold text-[#1e5631]">${months[m]}</h4><ul class="text-xs">${monthEvents.slice(0,5).map(ev=>`<li class="truncate">• ${ev.title}</li>`).join('')}${monthEvents.length>5?'<li>+ lainnya</li>':''}</ul>`;
                grid.appendChild(card);
            }
            document.getElementById('calendarContainer').classList.add('hidden');
            document.getElementById('yearView').classList.remove('hidden');
        }

        function hideYearView() { 
            document.getElementById('calendarContainer').classList.remove('hidden');
            document.getElementById('yearView').classList.add('hidden');
        }

        document.getElementById('toggleYearView').addEventListener('click', () => {
            const isYearVisible = !document.getElementById('yearView').classList.contains('hidden');
            if(isYearVisible) hideYearView();
            else showYearView();
        });

        async function loadTahunAjaran() {
            const tahunData = await fetchTahunAjaran();
            const select = document.getElementById('tahunAjaranSelect');
            select.innerHTML = tahunData.map(t => `<option value="${t.id}" ${t.aktif ? 'selected' : ''}>${t.nama}</option>`).join('');
            select.addEventListener('change', () => initCalendar(select.value));
        }

        function printCalendar() { window.print(); }

        (async function() {
            await loadTahunAjaran();
            const awalId = document.getElementById('tahunAjaranSelect').value;
            await initCalendar(awalId);
            loadRunningText();
            loadPrayerTimes();
            fetchCategories().then(cat => { categories = cat; });
        })();
    </script>
    <style>.animate-marquee { animation: marquee 15s linear infinite; } @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); }}</style>
</body>
</html>
